<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结识NPC CG - 预览</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'ZCOOL XiaoWei','Microsoft YaHei',sans-serif; background:#0d1b2a; overflow:hidden; height:100vh; }

.npcs {
  position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:100;
  display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
}
.npc-btn {
  padding:8px 18px; font-family:inherit; font-size:14px; color:#fff;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
  border-radius:20px; cursor:pointer; transition:all .2s; white-space:nowrap;
}
.npc-btn:hover { background:rgba(240,192,64,0.2); border-color:rgba(240,192,64,0.4); }

.container {
  width:100%; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(170deg,#0d1b2a 0%,#1b2838 40%,#1a1a2e 100%); position:relative; overflow:hidden;
}
.overlay {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 30%,rgba(240,192,64,0.08) 0%,transparent 50%),
             radial-gradient(ellipse at 30% 70%,rgba(168,85,247,0.04) 0%,transparent 50%),
             radial-gradient(ellipse at 70% 60%,rgba(59,130,246,0.04) 0%,transparent 50%);
}

.card {
  position:relative; z-index:1; background:rgba(255,255,255,0.07); backdrop-filter:blur(24px);
  border:1px solid rgba(240,192,64,0.2); border-radius:28px; padding:48px 52px;
  max-width:500px; width:90%; text-align:center;
  box-shadow:0 12px 60px rgba(0,0,0,0.45);
  transition:opacity .5s,transform .5s;
  opacity:0; transform:translateY(30px) scale(0.95);
}
.card.intro { opacity:1; transform:translateY(0) scale(1); }

.avatar-ring {
  width:120px; height:120px; border-radius:50%; margin:0 auto;
  border:4px solid rgba(240,192,64,0.5);
  box-shadow:0 0 32px rgba(240,192,64,0.25), inset 0 0 16px rgba(240,192,64,0.1);
  overflow:hidden; position:relative; animation:ringPulse 2s ease-in-out infinite;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,0.06);
}
@keyframes ringPulse {
  0%,100% { box-shadow:0 0 32px rgba(240,192,64,0.25),inset 0 0 16px rgba(240,192,64,0.1); }
  50% { box-shadow:0 0 48px rgba(240,192,64,0.4),inset 0 0 24px rgba(240,192,64,0.2); }
}
.avatar-img { width:100%; height:100%; object-fit:cover; }
.avatar-placeholder { font-size:56px; }

.sparkle {
  position:absolute; bottom:-8px; right:calc(50% - 70px); font-size:24px;
  animation:sparkleFloat 1.5s ease-in-out infinite;
}
@keyframes sparkleFloat {
  0%,100% { transform:translateY(0px); }
  50% { transform:translateY(-6px); }
}

.avatar-section { position:relative; margin-bottom:24px; }

.meet-label { font-size:14px; color:#f5d060; margin-bottom:8px; letter-spacing:4px; opacity:.8; }
.npc-name { font-size:36px; color:#f0c040; margin:0 0 16px; text-shadow:0 0 20px rgba(240,192,64,0.3); letter-spacing:8px; }
.tags { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:16px; }
.tag { padding:4px 12px; font-size:13px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:20px; color:rgba(255,255,255,0.75); }
.appearance { font-size:14px; color:rgba(255,255,255,0.5); margin-bottom:20px; line-height:1.6; font-family:'Microsoft YaHei',sans-serif; }
.first-meet {
  font-size:17px; color:rgba(255,255,255,0.85); line-height:1.8; padding:20px 24px;
  background:rgba(255,255,255,0.04); border-left:3px solid #f0c040;
  border-radius:0 12px 12px 0; font-style:italic; text-align:left;
  font-family:'Microsoft YaHei',sans-serif;
}
.hint { position:relative; z-index:1; margin-top:24px; font-size:13px; color:rgba(255,255,255,0.35); letter-spacing:1px; }
.info-section { color:#fff; }
</style>
</head>
<body>

<div class="npcs" id="npc-btns"></div>

<div class="container" id="cg-container">
  <div class="overlay"></div>
  <div class="card" id="cg-card">
    <div class="avatar-section">
      <div class="avatar-ring" id="cg-avatar-ring">
        <span class="avatar-placeholder" id="cg-avatar-content">👨</span>
      </div>
      <div class="sparkle" id="cg-sparkle">✨</div>
    </div>
    <div class="info-section">
      <div class="meet-label">— 结识了新朋友 —</div>
      <h1 class="npc-name" id="cg-name"></h1>
      <div class="tags" id="cg-tags"></div>
      <div class="appearance" id="cg-appearance"></div>
      <div class="first-meet" id="cg-firstmeet"></div>
    </div>
  </div>
  <p class="hint">将在通讯录中解锁此联系人</p>
</div>

<script>
const PERSONALITY = {
  sunny:{emoji:'☀️',label:'阳光开朗'},
  tsundere:{emoji:'😤',label:'傲娇别扭'},
  gentle:{emoji:'🌸',label:'温柔体贴'},
  shy:{emoji:'😳',label:'害羞内向'},
  mischievous:{emoji:'😏',label:'古灵精怪'},
};

const DEPTS = {
  life:'生活部',office:'办公室',sports:'体育部',media:'媒体部',social:'社联部',psychology:'心理部',
};

const NPCS = [
  { id:'maidan_ge',name:'买单哥',gender:'male',personality:'mischievous',department:'sports',year:1,hobby:'请客吃饭',appearance:'短发利落，运动休闲，蹦蹦跳跳',firstMeet:'哟！新来的？我叫买单哥，以后吃饭找我，哥请客！' },
  { id:'xiangyu',name:'香芋',gender:'male',personality:'sunny',department:'other',year:2,hobby:'吹牛',appearance:'刘海遮眉，工装风，说话带笑',firstMeet:'我叫香芋！跟你说，这学校没有我搞不定的事——呃，大部分吧。' },
  { id:'taozi',name:'桃子',gender:'female',personality:'gentle',department:'media',year:1,hobby:'烘焙',appearance:'长发披肩，温柔微笑，文艺系打扮',firstMeet:'你好呀~我是桃子，媒体部的。可以帮你拍好看的照片哦！' },
  { id:'xiaowang',name:'小王',gender:'male',personality:'shy',department:'office',year:1,hobby:'整理文件',appearance:'戴眼镜，斯文安静，校服整齐',firstMeet:'那个……你好，我是办公室的小王。有什么需要帮忙的尽管说……虽然我可能不太会。' },
  { id:'daiyu',name:'黛玉',gender:'female',personality:'tsundere',department:'psychology',year:1,hobby:'写诗',appearance:'古典气质，眉眼含愁，说话带刺',firstMeet:'你就是新来的干事？哼，先别指望我会对你有什么好脸色。不过……你倒是有几分意思。' },
  { id:'leilei',name:'蕾蕾',gender:'female',personality:'sunny',department:'social',year:1,hobby:'跳舞',appearance:'马尾辫，笑容灿烂，永远活力满满',firstMeet:'嗨嗨嗨！我是社联的蕾蕾！以后活动找我，保证让大家都嗨起来！' },
  { id:'zhangyi',name:'张艺',gender:'male',personality:'tsundere',department:'life',year:2,hobby:'训斥学弟',appearance:'板着脸，校服笔挺，眼神犀利',firstMeet:'你就是新来的？我是张艺，生活部部长。好好干，别给我丢人。' },
  { id:'sunian',name:'苏念',gender:'female',personality:'gentle',department:'other',year:3,hobby:'弹钢琴',appearance:'一袭白裙，气质清冷，声音温柔',firstMeet:'你好……我是苏念。樱花很美，不是吗？很高兴认识你。' },
  { id:'awen',name:'阿文',gender:'male',personality:'mischievous',department:'social',year:1,hobby:'说唱',appearance:'嘻哈风格，棒球帽反戴，永远在rap',firstMeet:'Yo！新来的？我叫阿文！yo~学生会里也有real talk，跟我混没错！' },
];

function showNPC(npc) {
  var p = PERSONALITY[npc.personality];
  document.getElementById('cg-avatar-content').textContent = npc.gender==='female'?'👩':'👨';
  document.getElementById('cg-avatar-ring').style.borderColor = npc.personality==='sunny' ? 'rgba(240,192,64,0.5)' : npc.personality==='gentle' ? 'rgba(255,182,193,0.5)' : npc.personality==='mischievous' ? 'rgba(168,85,247,0.5)' : npc.personality==='tsundere' ? 'rgba(231,76,60,0.5)' : 'rgba(59,130,246,0.5)';
  document.getElementById('cg-sparkle').textContent = p.emoji;
  document.getElementById('cg-name').textContent = npc.name;
  document.getElementById('cg-appearance').textContent = '外表：'+npc.appearance;
  document.getElementById('cg-firstmeet').textContent = '"'+npc.firstMeet+'"';

  var tags = '';
  tags += '<span class="tag">'+p.emoji+' '+p.label+'</span>';
  if (npc.department!=='other') tags += '<span class="tag">🏢 '+DEPTS[npc.department]+'</span>';
  tags += '<span class="tag">🎓 大'+(npc.year===1?'一':npc.year===2?'二':'三')+'</span>';
  tags += '<span class="tag">💝 '+npc.hobby+'</span>';
  document.getElementById('cg-tags').innerHTML = tags;

  var card = document.getElementById('cg-card');
  card.classList.remove('intro');
  void card.offsetWidth;
  card.classList.add('intro');
}

var btns = document.getElementById('npc-btns');
NPCS.forEach(function(n){
  var btn = document.createElement('button');
  btn.className = 'npc-btn';
  btn.textContent = n.gender==='female'?'👩':'👨' + ' ' + n.name;
  btn.onclick = function(){ showNPC(n); };
  btns.appendChild(btn);
});

// Show first NPC immediately
setTimeout(function(){ showNPC(NPCS[0]); }, 200);
</script>
</body>
</html>
